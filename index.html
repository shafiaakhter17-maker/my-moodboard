<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Little World 🌷</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7efe5;
    color: #493b35;
    font-family: 'Quicksand', sans-serif;
}

button {
    font-family: inherit;
    cursor: pointer;
}

/* =========================
   HOME
========================= */

#home {
    min-height: 100vh;
    padding: 30px 18px;
}

.title {
    text-align: center;
    margin-bottom: 25px;
}

.title h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(45px, 8vw, 70px);
    margin: 0;
    color: #604b43;
}

.title p {
    color: #92786c;
    margin-top: 5px;
}

.room {
    max-width: 1100px;
    height: 650px;
    margin: auto;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 50px rgba(80,55,40,.16);
}

.wall {
    height: 100%;
    position: relative;
    background:
        linear-gradient(#ead9ca 0 82%, #b98c69 82%);
}

/* Window */

.window {
    position: absolute;
    top: 50px;
    left: 8%;
    width: 190px;
    height: 170px;
    background: #bcd5d7;
    border: 12px solid #fff9f2;
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(80,55,40,.12);
}

.window::before {
    content: "";
    position: absolute;
    width: 7px;
    height: 100%;
    background: #fff9f2;
    left: 50%;
}

.window::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 7px;
    background: #fff9f2;
    top: 48%;
}

.sun {
    width: 55px;
    height: 55px;
    background: #f1ce82;
    border-radius: 50%;
    position: absolute;
    right: 20px;
    top: 15px;
}

/* =========================
   CLICKABLE OBJECTS
========================= */

.object {
    position: absolute;
    border: none;
    background: transparent;
    color: #4f3e36;
    text-align: center;
    transition: .25s;
}

.object:hover {
    transform: translateY(-8px) scale(1.05);
}

.object .emoji {
    display: block;
    font-size: 65px;
    filter: drop-shadow(0 8px 5px rgba(0,0,0,.12));
}

.object span:last-child {
    display: block;
    background: rgba(255,250,245,.9);
    padding: 6px 11px;
    border-radius: 18px;
    font-weight: 600;
}

/* Positions */

.books {
    left: 7%;
    bottom: 70px;
}

.music {
    left: 34%;
    top: 270px;
}

.movies {
    right: 7%;
    top: 75px;
}

.memories {
    right: 32%;
    top: 55px;
}

.favorites {
    left: 52%;
    bottom: 45px;
}

.diary {
    right: 7%;
    bottom: 45px;
}

/* Desk */

.desk {
    position: absolute;
    width: 43%;
    height: 90px;
    left: 29%;
    bottom: 0;
    background: #956b4f;
    border-radius: 15px 15px 0 0;
}

.desk::before,
.desk::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 100px;
    top: 75px;
    background: #75523e;
}

.desk::before {
    left: 20px;
}

.desk::after {
    right: 20px;
}

.plant {
    position: absolute;
    right: 21%;
    bottom: 70px;
    font-size: 65px;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(50,35,28,.55);
    z-index: 100;
    padding: 15px;
    align-items: center;
    justify-content: center;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(850px, 100%);
    max-height: 92vh;
    overflow-y: auto;
    background: #fffaf5;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 25px 70px rgba(0,0,0,.25);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
}

.close {
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #ead8c8;
    font-size: 22px;
}

.back {
    border: none;
    background: #ead8c8;
    padding: 9px 16px;
    border-radius: 20px;
    margin: 15px 0;
}

/* =========================
   BOOK SEARCH
========================= */

.search-area {
    background: #f5e9dd;
    border-radius: 20px;
    padding: 18px;
}

.search-area label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

.search-row {
    display: flex;
    gap: 8px;
}

.search-row input {
    flex: 1;
    min-width: 0;
    border: 1px solid #d9c3b2;
    background: #fffaf5;
    border-radius: 13px;
    padding: 12px;
    font-family: inherit;
    outline: none;
}

.search-btn {
    border: none;
    background: #8c6b5b;
    color: white;
    border-radius: 13px;
    padding: 0 17px;
    font-weight: 600;
}

.search-btn:hover {
    background: #705347;
}

.status {
    text-align: center;
    color: #91786b;
    padding: 15px;
}

/* Search results */

.results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 15px;
    margin-top: 18px;
}

.result {
    background: #fffaf5;
    border: 2px solid transparent;
    border-radius: 17px;
    padding: 10px;
    cursor: pointer;
    transition: .2s;
}

.result:hover {
    transform: translateY(-4px);
    border-color: #b89986;
}

.result img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
    background: #ead8c8;
}

.result h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    margin: 8px 2px 2px;
}

.result p {
    margin: 2px;
    font-size: 12px;
    color: #806b61;
}

/* =========================
   BOOKSHELF
========================= */

.shelf-title {
    margin-top: 30px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
}

.shelf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px;
}

.book {
    position: relative;
    background: #f3e4d7;
    padding: 10px;
    border-radius: 17px;
}

.book img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
}

.book h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    margin: 8px 2px 2px;
}

.book p {
    margin: 2px;
    font-size: 12px;
    color: #806b61;
}

.remove {
    position: absolute;
    right: 16px;
    top: 16px;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    font-size: 17px;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #9a8176;
}

/* =========================
   OTHER SECTIONS
========================= */

.coming-soon {
    text-align: center;
    padding: 50px 20px;
}

.coming-soon .big {
    font-size: 70px;
}

.coming-soon h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
}

.coming-soon p {
    color: #8d7468;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    #home {
        padding: 18px 10px;
    }

    .room {
        height: 650px;
    }

    .window {
        left: 50%;
        transform: translateX(-50%);
        width: 150px;
        height: 135px;
    }

    .object .emoji {
        font-size: 48px;
    }

    .books {
        left: 3%;
        bottom: 110px;
    }

    .music {
        left: 37%;
        top: 245px;
    }

    .movies {
        right: 2%;
        top: 350px;
    }

    .memories {
        left: 4%;
        top: 330px;
    }

    .favorites {
        left: 39%;
        bottom: 25px;
    }

    .diary {
        right: 3%;
        bottom: 105px;
    }

    .desk,
    .plant {
        display: none;
    }

    .search-row {
        flex-direction: column;
    }

    .search-btn {
        padding: 12px;
    }
}
</style>
</head>


<body>

<!-- =========================
     HOME
========================= -->

<section id="home">

    <div class="title">
        <h1>my little world 🌷</h1>
        <p>a tiny corner of the internet that belongs to me</p>
    </div>

    <div class="room">

        <div class="wall">

            <div class="window">
                <div class="sun"></div>
            </div>

            <!-- BOOKS -->

            <button class="object books" onclick="openBookshelf()">
                <span class="emoji">📚</span>
                <span>Bookshelf</span>
            </button>

            <!-- MUSIC -->

            <button class="object music" onclick="openSimpleSection('🎧 My Music','songs that live in my head')">
                <span class="emoji">🎧</span>
                <span>Music</span>
            </button>

            <!-- MOVIES -->

            <button class="object movies" onclick="openSimpleSection('🎬 My Watchlist','things I want to watch')">
                <span class="emoji">🎬</span>
                <span>Watchlist</span>
            </button>

            <!-- MEMORIES -->

            <button class="object memories" onclick="openSimpleSection('🖼️ My Memories','little moments worth keeping')">
                <span class="emoji">🖼️</span>
                <span>Memories</span>
            </button>

            <!-- FAVORITES -->

            <button class="object favorites" onclick="openSimpleSection('🌸 My Favorites','things I simply love')">
                <span class="emoji">🌸</span>
                <span>Favorites</span>
            </button>

            <!-- DIARY -->

            <button class="object diary" onclick="openSimpleSection('📓 My Diary','little pieces of my thoughts')">
                <span class="emoji">📓</span>
                <span>Diary</span>
            </button>

            <div class="plant">🪴</div>

            <div class="desk"></div>

        </div>

    </div>

</section>


<!-- =========================
     BOOKSHELF MODAL
========================= -->

<div class="modal" id="bookModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>📚 My Bookshelf</h2>

            <button class="close" onclick="closeBookshelf()">×</button>

        </div>

        <button class="back" onclick="closeBookshelf()">
            ← Back to my room
        </button>


        <!-- SEARCH -->

        <div class="search-area">

            <label>Find a book ✨</label>

            <div class="search-row">

                <input
                    id="bookSearch"
                    type="text"
                    placeholder="Type a book name..."
                    onkeydown="if(event.key==='Enter') searchBooks()"
                >

                <button class="search-btn" onclick="searchBooks()">
                    🔍 Search
                </button>

            </div>

            <div id="status"></div>

            <div class="results" id="results"></div>

        </div>


        <!-- SHELF -->

        <h2 class="shelf-title">My collection 🌷</h2>

        <div class="shelf" id="shelf"></div>

    </div>

</div>


<!-- =========================
     SIMPLE SECTION MODAL
========================= -->

<div class="modal" id="simpleModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="simpleTitle"></h2>

            <button class="close" onclick="closeSimpleSection()">×</button>

        </div>

        <button class="back" onclick="closeSimpleSection()">
            ← Back to my room
        </button>

        <div class="coming-soon">

            <div class="big">🌷</div>

            <h2 id="simpleDescription"></h2>

            <p>
                This little corner is waiting to be created...
                ✨
            </p>

        </div>

    </div>

</div>


<script>

/* =========================
   BOOKSHELF
========================= */

function openBookshelf() {

    document.getElementById("bookModal").classList.add("show");

    loadBooks();

}


function closeBookshelf() {

    document.getElementById("bookModal").classList.remove("show");

}


/* =========================
   SEARCH OPEN LIBRARY
========================= */

async function searchBooks() {

    const query =
        document.getElementById("bookSearch").value.trim();

    const results =
        document.getElementById("results");

    const status =
        document.getElementById("status");

    results.innerHTML = "";

    if (!query) {

        status.innerHTML =
            "Type a book name first 🌷";

        return;

    }

    status.innerHTML =
        "Searching for your book... 🔎";

    try {

        const response = await fetch(
            "https://openlibrary.org/search.json?q=" +
            encodeURIComponent(query) +
            "&limit=12"
        );

        if (!response.ok) {
            throw new Error("Search failed");
        }

        const data = await response.json();

        results.innerHTML = "";

        if (!data.docs || data.docs.length === 0) {

            status.innerHTML =
                "I couldn't find that book. Try another name 🌷";

            return;

        }

        status.innerHTML =
            "Choose the book you want to add ✨";

        data.docs.forEach(book => {

            if (!book.cover_i) return;

            const card =
                document.createElement("div");

            card.className = "result";

            const title =
                book.title || "Unknown title";

            const author =
                book.author_name
                ? book.author_name[0]
                : "Unknown author";

            const cover =
                "https://covers.openlibrary.org/b/id/" +
                book.cover_i +
                "-M.jpg";

            card.innerHTML = `

                <img
                    src="${cover}"
                    alt=""
                >

                <h3>${escapeHTML(title)}</h3>

                <p>${escapeHTML(author)}</p>

            `;

            card.onclick = function() {

                addBook({

                    title: title,

                    author: author,

                    cover: cover

                });

            };

            results.appendChild(card);

        });

        if (results.children.length === 0) {

            status.innerHTML =
                "No covers were found for that search. Try another book 🌸";

        }

    }

    catch(error) {

        console.error(error);

        status.innerHTML =
            "Something went wrong. Please check your internet connection and try again.";

    }

}


/* =========================
   ADD BOOK
========================= */

function addBook(book) {

    const books =
        JSON.parse(
            localStorage.getItem("myLittleWorldBooks")
        ) || [];

    const alreadyAdded =
        books.some(
            item =>
            item.title === book.title &&
            item.author === book.author
        );

    if (alreadyAdded) {

        alert("This book is already on your shelf 📚");

        return;

    }

    books.push({

        id: Date.now(),

        title: book.title,

        author: book.author,

        cover: book.cover

    });

    localStorage.setItem(
        "myLittleWorldBooks",
        JSON.stringify(books)
    );

    loadBooks();

}


/* =========================
   LOAD BOOKS
========================= */

function loadBooks() {

    const shelf =
        document.getElementById("shelf");

    const books =
        JSON.parse(
            localStorage.getItem("myLittleWorldBooks")
        ) || [];

    shelf.innerHTML = "";

    if (books.length === 0) {

        shelf.innerHTML =
            '<div class="empty">Your shelf is waiting for its first book... 📚🌷</div>';

        return;

    }

    books.forEach(book => {

        const card =
            document.createElement("div");

        card.className = "book";

        card.innerHTML = `

            <button
                class="remove"
                onclick="deleteBook(${book.id})"
            >
                ×
            </button>

            <img
                src="${book.cover}"
                alt=""
            >

            <h3>${escapeHTML(book.title)}</h3>

            <p>${escapeHTML(book.author)}</p>

        `;

        shelf.appendChild(card);

    });

}


/* =========================
   DELETE BOOK
========================= */

function deleteBook(id) {

    let books =
        JSON.parse(
            localStorage.getItem("myLittleWorldBooks")
        ) || [];

    books =
        books.filter(book => book.id !== id);

    localStorage.setItem(
        "myLittleWorldBooks",
        JSON.stringify(books)
    );

    loadBooks();

}


/* =========================
   OTHER SECTIONS
========================= */

function openSimpleSection(title, description) {

    document.getElementById("simpleTitle").textContent =
        title;

    document.getElementById("simpleDescription").textContent =
        description;

    document.getElementById("simpleModal").classList.add("show");

}


function closeSimpleSection() {

    document.getElementById("simpleModal").classList.remove("show");

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =========================
   CLOSE WHEN CLICKING OUTSIDE
========================= */

document.getElementById("bookModal").addEventListener(
    "click",
    function(event) {

        if (event.target === this) {
            closeBookshelf();
        }

    }
);


document.getElementById("simpleModal").addEventListener(
    "click",
    function(event) {

        if (event.target === this) {
            closeSimpleSection();
        }

    }
);

</script>

</body>
</html>
