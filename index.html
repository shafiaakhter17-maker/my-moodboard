<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Little World ♡</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Georgia, "Times New Roman", serif;
    color:#4d3b35;
    background:#eee4dc;
}

button{
    font-family:inherit;
}

.hidden{
    display:none !important;
}


/* =====================================================
   ROOM
===================================================== */

#room{
    width:100vw;
    height:100vh;
    overflow:hidden;
    position:relative;

    background:
        linear-gradient(
            to bottom,
            #eee5dc 0%,
            #eee5dc 68%,
            #b49378 68%,
            #b49378 100%
        );
}

.wall{
    position:absolute;
    inset:0 0 32% 0;

    background-image:
        radial-gradient(
            #d7c8bd 1px,
            transparent 1px
        );

    background-size:25px 25px;
}


/* =====================================================
   ROOM TITLE
===================================================== */

.room-title{
    position:absolute;
    top:24px;
    left:35px;

    font-size:28px;
    font-style:italic;
}


/* =====================================================
   WINDOW
===================================================== */

.window{
    position:absolute;

    width:180px;
    height:220px;

    top:12%;
    left:7%;

    border:12px solid #907363;

    background:#aec9c9;

    box-shadow:
        0 10px 25px #604b3b22;
}

.window:before{
    content:"";

    position:absolute;

    width:8px;
    height:100%;

    left:50%;

    background:#907363;

    transform:translateX(-50%);
}

.window:after{
    content:"";

    position:absolute;

    width:100%;
    height:8px;

    top:50%;

    background:#907363;

    transform:translateY(-50%);
}

.moon{
    position:absolute;

    width:48px;
    height:48px;

    right:20px;
    top:20px;

    border-radius:50%;

    background:#fff2c9;

    box-shadow:
        0 0 25px #fff2c9;
}


/* =====================================================
   STARS
===================================================== */

.star{
    position:absolute;

    color:#a58c7c;

    font-size:20px;
}

.star1{
    top:10%;
    left:35%;
}

.star2{
    top:32%;
    left:42%;
}

.star3{
    top:15%;
    right:34%;
}

.star4{
    top:43%;
    right:15%;
}


/* =====================================================
   BED
===================================================== */

.bed{
    position:absolute;

    width:38%;
    height:25%;

    right:6%;
    bottom:25%;

    background:#96735f;

    border-radius:18px;

    box-shadow:
        8px 10px 20px #604b3b22;

    cursor:pointer;

    transition:.3s;
}

.bed:hover{
    transform:scale(1.02);
}

.mattress{
    position:absolute;

    width:96%;
    height:75%;

    top:-15%;
    left:2%;

    background:#f5eae1;

    border-radius:15px;
}

.pillow{
    position:absolute;

    width:30%;
    height:35%;

    left:8%;
    top:3%;

    background:#fffaf4;

    border-radius:15px;
}

.blanket{
    position:absolute;

    width:55%;
    height:72%;

    right:0;
    top:0;

    background:#cbb0a5;

    border-radius:15px;
}


/* =====================================================
   DESK
===================================================== */

.desk{
    position:absolute;

    width:37%;
    height:12%;

    left:5%;
    bottom:24%;

    background:#755541;

    border-radius:10px;
}

.desk:after{
    content:"";

    position:absolute;

    width:7%;
    height:150%;

    left:8%;
    top:90%;

    background:#604637;

    box-shadow:
        300px 0 #604637;
}


/* =====================================================
   LAPTOP
===================================================== */

.laptop{
    position:absolute;

    width:25%;
    height:10%;

    left:11%;
    bottom:35%;

    cursor:pointer;

    transition:.3s;
}

.laptop:hover{
    transform:scale(1.07);
}

.laptop-screen{
    position:absolute;

    width:100%;
    height:120%;

    bottom:45%;

    background:#30282c;

    border:8px solid #625456;

    border-radius:8px;
}

.laptop-screen span{
    position:absolute;

    top:25%;
    left:45%;

    color:#efd8d5;

    font-size:32px;
}

.laptop-base{
    position:absolute;

    width:110%;
    height:18%;

    bottom:25%;
    left:-5%;

    background:#917b78;

    border-radius:5px 5px 12px 12px;
}


/* =====================================================
   BOOKSHELF
===================================================== */

.bookshelf{
    position:absolute;

    width:16%;
    height:43%;

    left:50%;
    top:14%;

    padding:10px;

    background:#856451;

    cursor:pointer;

    transition:.3s;
}

.bookshelf:hover{
    transform:scale(1.04);
}

.shelf-row{
    height:27%;

    margin-bottom:8%;

    border-bottom:7px solid #604637;

    display:flex;
    align-items:end;

    gap:5px;
}

.book{
    width:18%;
    height:80%;

    background:#c9aaa0;
}

.book:nth-child(2){
    height:65%;
    background:#b6a187;
}

.book:nth-child(3){
    height:90%;
    background:#d8c4ac;
}


/* =====================================================
   HEADPHONES
===================================================== */

.headphones{
    position:absolute;

    left:28%;
    bottom:38%;

    font-size:55px;

    cursor:pointer;

    transition:.3s;
}

.headphones:hover{
    transform:scale(1.1);
}


/* =====================================================
   PLANT
===================================================== */

.plant{
    position:absolute;

    right:45%;
    bottom:25%;

    font-size:60px;

    cursor:pointer;

    transition:.3s;
}

.plant:hover{
    transform:rotate(5deg) scale(1.1);
}


/* =====================================================
   WALL PHOTOS
===================================================== */

.wall-photos{
    position:absolute;

    right:8%;
    top:10%;

    display:flex;
    gap:15px;
}

.photo-frame{
    width:85px;
    height:105px;

    padding:7px;

    background:#fffaf4;

    box-shadow:3px 5px 15px #0002;

    cursor:pointer;

    transform:rotate(-5deg);
}

.photo-frame:nth-child(2){
    transform:rotate(5deg);
}

.photo-inside{
    width:100%;
    height:75%;

    background:#d4b8aa;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;
}


/* =====================================================
   RUG
===================================================== */

.rug{
    position:absolute;

    width:45%;
    height:15%;

    left:27%;
    bottom:5%;

    background:#d4b6a2;

    border-radius:50%;

    box-shadow:
        inset 0 0 0 8px #c19d87;
}


/* =====================================================
   COLLECTION PAGE
===================================================== */

#collectionPage{
    display:none;

    min-height:100vh;

    background:#f5ece5;

    padding:25px;
}

.collection-top{
    display:flex;

    align-items:center;

    gap:15px;

    max-width:1200px;

    margin:auto;
}

.back-button,
.add-section-button,
.add-item-button,
.small-button{
    border:0;

    background:#a98a7b;

    color:white;

    padding:10px 18px;

    border-radius:25px;

    cursor:pointer;

    transition:.2s;
}

.back-button:hover,
.add-section-button:hover,
.add-item-button:hover,
.small-button:hover{
    transform:translateY(-2px);
    background:#927466;
}


/* =====================================================
   COLLECTION HEADER
===================================================== */

.collection-header{
    max-width:900px;

    margin:30px auto;

    text-align:center;
}

.collection-header h1{
    font-size:42px;

    margin:10px 0;
}

.collection-header p{
    color:#806c63;
}


/* =====================================================
   SECTION BAR
===================================================== */

.section-bar{
    max-width:1200px;

    margin:20px auto;

    display:flex;

    gap:10px;

    overflow-x:auto;

    padding:5px;
}

.section-button{
    flex-shrink:0;

    border:0;

    padding:11px 20px;

    border-radius:25px;

    background:#e1cec4;

    color:#5c4b44;

    cursor:pointer;
}

.section-button.active{
    background:#947365;

    color:white;
}

.delete-section{
    flex-shrink:0;

    border:2px dashed #ad9081;

    background:transparent;

    color:#765e53;

    padding:9px 17px;

    border-radius:25px;

    cursor:pointer;
}


/* =====================================================
   ITEMS
===================================================== */

.items-container{
    max-width:1200px;

    margin:30px auto;
}


/* PHOTO / CARD MASONRY */

.photo-grid{
    columns:4 180px;

    column-gap:16px;
}

.photo-card{
    break-inside:avoid;

    margin-bottom:16px;

    position:relative;

    cursor:pointer;
}

.photo-card img{
    width:100%;

    display:block;

    border-radius:17px;

    transition:.25s;
}

.photo-card img:hover{
    transform:scale(1.015);
}


/* BOOK GRID */

.book-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));

    gap:20px;
}

.book-card{
    background:#fffaf5;

    border-radius:18px;

    padding:18px;

    box-shadow:0 5px 20px #0001;

    cursor:pointer;

    transition:.25s;
}

.book-card:hover{
    transform:translateY(-5px);
}

.book-cover{
    height:230px;

    border-radius:12px;

    background:#d5b8aa;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:50px;

    margin-bottom:12px;
}

.book-title{
    font-size:18px;

    font-weight:bold;
}

.book-author{
    color:#89756c;

    margin-top:5px;

    font-size:14px;
}


/* GENERIC CARD */

.card-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(190px,1fr));

    gap:18px;
}

.generic-card{
    background:#fffaf5;

    padding:25px;

    border-radius:20px;

    box-shadow:0 5px 20px #0001;

    cursor:pointer;

    transition:.25s;
}

.generic-card:hover{
    transform:translateY(-5px);
}

.generic-icon{
    font-size:45px;

    margin-bottom:12px;
}

.generic-title{
    font-size:19px;

    font-weight:bold;
}

.generic-description{
    color:#8a766d;

    margin-top:7px;

    font-size:14px;
}


/* =====================================================
   ADD ITEM FORM
===================================================== */

.form-overlay{
    position:fixed;

    inset:0;

    background:#3c2f2b99;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:300;
}

.form-box{
    width:min(95%,480px);

    max-height:90vh;

    overflow-y:auto;

    background:#fff8f1;

    border-radius:25px;

    padding:30px;

    box-shadow:0 20px 60px #0004;
}

.form-box h2{
    margin-top:0;
}

.form-box label{
    display:block;

    margin-top:15px;

    margin-bottom:6px;

    font-size:14px;
}

.form-box input,
.form-box textarea,
.form-box select{
    width:100%;

    padding:12px;

    border:1px solid #d7c5bb;

    border-radius:12px;

    background:white;

    font-family:inherit;
}

.form-buttons{
    display:flex;

    gap:10px;

    margin-top:20px;
}

.cancel-button{
    border:0;

    padding:10px 18px;

    border-radius:20px;

    background:#dfcec4;

    color:#5d4c44;

    cursor:pointer;
}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state{
    text-align:center;

    padding:70px 20px;

    color:#8a766d;
}

.empty-state h2{
    color:#625149;
}


/* =====================================================
   IMAGE VIEWER
===================================================== */

#imageViewer{
    position:fixed;

    inset:0;

    background:#211b19ee;

    display:none;

    align-items:center;

    justify-content:center;

    z-index:500;

    padding:20px;
}

#imageViewer img{
    max-width:90%;

    max-height:90%;

    object-fit:contain;

    border-radius:15px;
}

.close-viewer{
    position:absolute;

    top:20px;
    right:25px;

    width:42px;
    height:42px;

    border:0;

    border-radius:50%;

    background:white;

    font-size:22px;

    cursor:pointer;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .room-title{
        left:18px;
        top:18px;
        font-size:21px;
    }

    .window{
        width:120px;
        height:150px;
    }

    .bookshelf{
        width:23%;
        height:35%;
        left:45%;
    }

    .bed{
        width:48%;
        height:22%;
    }

    .desk{
        width:42%;
    }

    .laptop{
        width:30%;
    }

    .wall-photos{
        display:none;
    }

    .headphones{
        left:27%;
        font-size:42px;
    }

    .plant{
        font-size:45px;
    }

    .collection-header h1{
        font-size:30px;
    }

    #collectionPage{
        padding:18px;
    }

    .photo-grid{
        columns:2 130px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     ROOM
===================================================== -->

<div id="room">

    <div class="wall"></div>


    <div class="room-title">
        my little world ♡
    </div>


    <div class="window">
        <div class="moon"></div>
    </div>


    <div class="star star1">✦</div>
    <div class="star star2">✧</div>
    <div class="star star3">✦</div>
    <div class="star star4">✧</div>


    <!-- WALL PHOTOS -->

    <div class="wall-photos">

        <div class="photo-frame"
             onclick="openCollection('photos')">

            <div class="photo-inside">
                🌷
            </div>

        </div>


        <div class="photo-frame"
             onclick="openCollection('photos')">

            <div class="photo-inside">
                ☁️
            </div>

        </div>

    </div>


    <!-- BOOKSHELF -->

    <div class="bookshelf"
         onclick="openCollection('books')">

        <div class="shelf-row">
            <div class="book"></div>
            <div class="book"></div>
            <div class="book"></div>
        </div>

        <div class="shelf-row">
            <div class="book"></div>
            <div class="book"></div>
            <div class="book"></div>
        </div>

        <div class="shelf-row">
            <div class="book"></div>
            <div class="book"></div>
        </div>

    </div>


    <!-- BED -->

    <div class="bed"
         onclick="openCollection('bed')">

        <div class="mattress"></div>

        <div class="pillow"></div>

        <div class="blanket"></div>

    </div>


    <!-- DESK -->

    <div class="desk"></div>


    <!-- LAPTOP -->

    <div class="laptop"
         onclick="openCollection('laptop')">

        <div class="laptop-screen">
            <span>♡</span>
        </div>

        <div class="laptop-base"></div>

    </div>


    <!-- HEADPHONES -->

    <div class="headphones"
         onclick="openCollection('music')">

        🎧

    </div>


    <!-- PLANT -->

    <div class="plant"
         onclick="openCollection('journal')">

        🪴

    </div>


    <!-- RUG -->

    <div class="rug"></div>

</div>



<!-- =====================================================
     COLLECTION PAGE
===================================================== -->

<div id="collectionPage">

    <div class="collection-top">

        <button class="back-button"
                onclick="goHome()">

            ← Room

        </button>

    </div>


    <div class="collection-header">

        <h1 id="collectionTitle">
            My Collection
        </h1>

        <p id="collectionSubtitle">
            Make this space yours ♡
        </p>

    </div>


    <!-- SECTIONS -->

    <div class="section-bar"
         id="sectionBar">
    </div>


    <div style="text-align:center">

        <button class="add-section-button"
                onclick="addSection()">

            ＋ Add section

        </button>

        <button class="add-item-button"
                onclick="openAddItem()">

            ＋ Add item

        </button>

    </div>


    <!-- ITEMS -->

    <div class="items-container"
         id="itemsContainer">
    </div>

</div>



<!-- =====================================================
     ADD ITEM FORM
===================================================== -->

<div class="form-overlay"
     id="itemForm">

    <div class="form-box">

        <h2 id="formTitle">
            Add something ♡
        </h2>


        <label>
            Name
        </label>

        <input
            id="itemName"
            type="text"
            placeholder="e.g. The Little Prince"
        >


        <label>
            Description / Author
        </label>

        <input
            id="itemDescription"
            type="text"
            placeholder="optional"
        >


        <div id="imageField">

            <label>
                Picture
            </label>

            <input
                id="itemImage"
                type="file"
                accept="image/*"
            >

        </div>


        <div id="iconField">

            <label>
                Choose an icon
            </label>

            <select id="itemIcon">

                <option>♡</option>
                <option>🌷</option>
                <option>🌿</option>
                <option>🎧</option>
                <option>🎬</option>
                <option>📖</option>
                <option>☁️</option>
                <option>⭐</option>
                <option>🎀</option>
                <option>🌙</option>

            </select>

        </div>


        <div class="form-buttons">

            <button class="small-button"
                    onclick="saveItem()">

                Save ♡

            </button>

            <button class="cancel-button"
                    onclick="closeForm()">

                Cancel

            </button>

        </div>

    </div>

</div>



<!-- =====================================================
     IMAGE VIEWER
===================================================== -->

<div id="imageViewer">

    <button class="close-viewer"
            onclick="closeViewer()">

        ×

    </button>

    <img id="viewerImage">

</div>



<script>

/* =====================================================
   COLLECTION CONFIG

const collectionInfo = {

            "Aesthetic",

            "Favorites",

            "Want to Read"
        ]
    },

    music:{
        title:"My Music 🎧",
        subtitle:"Keep your favorite sounds here.",
        type:"generic",
        sections:[
            "Favorite Songs",
            "Playlists"
        ]
    },

    bed:{
        title:"Cozy Corner 🛏️",
        subtitle:"Movies, shows and all your comfort things.",
        type:"generic",
        sections:[
            "Movies",
            "Shows",
            "Comfort"
        ]
    },

    laptop:{
        title:"My Laptop 💻",
        subtitle:"Your own little digital collection.",
        type:"generic",
        sections:[
            "Favorites",
            "Websites",
            "Things I Love"
        ]
    },

    journal:{
        title:"Little Garden 🌱",
