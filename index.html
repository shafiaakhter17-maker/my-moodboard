<script>

let database = JSON.parse(localStorage.getItem("littleWorldDatabase")) || {};

let currentCollection = "";
let currentSection = "";


/* COLLECTIONS */

const collections = {

    photos: {
        title: "Photos ♡",
        subtitle: "Your little picture world",
        type: "photo",
        sections: ["Aesthetic", "Nature", "Anime"]
    },

    books: {
        title: "My Bookshelf 📚",
        subtitle: "Your favorite books",
        type: "book",
        sections: ["Favorites", "Currently Reading", "Want to Read"]
    },

    music: {
        title: "My Music 🎧",
        subtitle: "Everything you love listening to",
        type: "normal",
        sections: ["Favorite Songs", "Playlists"]
    },

    bed: {
        title: "Cozy Corner 🛏️",
        subtitle: "Your comfort space",
        type: "normal",
        sections: ["Movies", "Shows", "Favorites"]
    },

    laptop: {
        title: "My Laptop 💻",
        subtitle: "Your personal digital space",
        type: "normal",
        sections: ["Favorites", "Websites", "Things I Love"]
    },

    journal: {
        title: "Little Garden 🌱",
        subtitle: "Your thoughts and memories",
        type: "normal",
        sections: ["Thoughts", "Memories", "Quotes"]
    }

};


/* SAVE */

function saveData(){

    localStorage.setItem(
        "littleWorldDatabase",
        JSON.stringify(database)
    );

}


/* OPEN COLLECTION */

function openCollection(name){

    currentCollection = name;

    if(!database[name]){

        database[name] = {
            sections: {}
        };

    }


    collections[name].sections.forEach(function(section){

        if(!database[name].sections[section]){

            database[name].sections[section] = [];

        }

    });


    saveData();


    currentSection =
        Object.keys(database[name].sections)[0];


    document.getElementById("room").style.display =
        "none";

    document.getElementById("collectionPage").style.display =
        "block";


    document.getElementById("collectionTitle").innerText =
        collections[name].title;

    document.getElementById("collectionSubtitle").innerText =
        collections[name].subtitle;


    renderSections();

}


/* BACK TO ROOM */

function goHome(){

    document.getElementById("collectionPage").style.display =
        "none";

    document.getElementById("room").style.display =
        "block";

}


/* SECTIONS */

function renderSections(){

    const bar =
        document.getElementById("sectionBar");

    bar.innerHTML = "";


    const sections =
        Object.keys(
            database[currentCollection].sections
        );


    sections.forEach(function(section){

        const button =
            document.createElement("button");

        button.className =
            "section-button";

        button.innerText =
            "♡ " + section;


        if(section === currentSection){

            button.classList.add("active");

        }


        button.onclick = function(){

            currentSection = section;

            renderSections();

        };


        bar.appendChild(button);

    });


    const add =
        document.createElement("button");

    add.className =
        "section-button";

    add.innerText =
        "＋ Add section";


    add.onclick = addSection;


    bar.appendChild(add);


    const deleteButton =
        document.createElement("button");

    deleteButton.className =
        "delete-section";

    deleteButton.innerText =
        "− Delete section";


    deleteButton.onclick =
        deleteSection;


    bar.appendChild(deleteButton);


    renderItems();

}


/* ADD SECTION */

function addSection(){

    const name =
        prompt("Name your new section ♡");


    if(!name) return;


    const clean =
        name.trim();


    if(!clean) return;


    if(
        database[currentCollection]
        .sections[clean]
    ){

        alert("This section already exists!");

        return;

    }


    database[currentCollection]
        .sections[clean] = [];


    currentSection = clean;


    saveData();

    renderSections();

}


/* DELETE SECTION */

function deleteSection(){

    const sections =
        Object.keys(
            database[currentCollection].sections
        );


    if(sections.length <= 1){

        alert("Keep at least one section ♡");

        return;

    }


    if(
        !confirm(
            "Delete this section and everything inside it?"
        )
    ){

        return;

    }


    delete database[currentCollection]
        .sections[currentSection];


    currentSection =
        Object.keys(
            database[currentCollection].sections
        )[0];


    saveData();

    renderSections();

}


/* OPEN ADD ITEM */

function openAddItem(){

    document.getElementById("itemName").value = "";

    document.getElementById("itemDescription").value = "";

    document.getElementById("itemImage").value = "";


    const type =
        collections[currentCollection].type;


    document.getElementById("imageField").style.display =
        (type === "photo" || type === "book")
        ? "block"
        : "none";


    document.getElementById("iconField").style.display =
        type === "normal"
        ? "block"
        : "none";


    document.getElementById("formTitle").innerText =
        "Add to " + currentSection + " ♡";


    document.getElementById("itemForm").style.display =
        "flex";

}


/* CLOSE FORM */

function closeForm(){

    document.getElementById("itemForm").style.display =
        "none";

}


/* SAVE ITEM */

function saveItem(){

    const name =
        document.getElementById("itemName")
        .value
        .trim();


    const description =
        document.getElementById("itemDescription")
        .value
        .trim();


    if(!name){

        alert("Please enter a name ♡");

        return;

    }


    const item = {

        name: name,

        description: description,

        icon:
            document.getElementById("itemIcon").value,

        image: null

    };


    const file =
        document.getElementById("itemImage").files[0];


    if(file){

        const reader =
            new FileReader();


        reader.onload = function(){

            item.image =
                reader.result;


            database[currentCollection]
                .sections[currentSection]
                .push(item);


            saveData();

            closeForm();

            renderItems();

        };


        reader.readAsDataURL(file);

    }

    else{

        database[currentCollection]
            .sections[currentSection]
            .push(item);


        saveData();

        closeForm();

        renderItems();

    }

}


/* RENDER ITEMS */

function renderItems(){

    const container =
        document.getElementById("itemsContainer");

    container.innerHTML = "";


    const items =
        database[currentCollection]
        .sections[currentSection];


    if(items.length === 0){

        container.innerHTML = `

            <div class="empty-state">

                <h2>Nothing here yet ♡</h2>

                <p>
                    Click ＋ Add item to start your collection.
                </p>

            </div>

        `;

        return;

    }


    const type =
        collections[currentCollection].type;


    if(type === "photo"){

        const grid =
            document.createElement("div");

        grid.className = "photo-grid";


        items.forEach(function(item,index){

            const card =
                document.createElement("div");

            card.className = "photo-card";


            if(item.image){

                const image =
                    document.createElement("img");

                image.src =
                    item.image;


                image.onclick = function(){

                    document.getElementById("viewerImage").src =
                        item.image;

                    document.getElementById("imageViewer").style.display =
                        "flex";

                };


                card.appendChild(image);

            }


            addDelete(card,index);

            grid.appendChild(card);

        });


        container.appendChild(grid);

    }


    else if(type === "book"){

        const grid =
            document.createElement("div");

        grid.className = "book-grid";


        items.forEach(function(item,index){

            const card =
                document.createElement("div");

            card.className = "book-card";


            const cover =
                document.createElement("div");

            cover.className = "book-cover";


            if(item.image){

                const image =
                    document.createElement("img");

                image.src =
                    item.image;

                image.style.width = "100%";

                image.style.height = "100%";

                image.style.objectFit = "cover";

                image.style.borderRadius = "12px";


                cover.appendChild(image);

            }

            else{

                cover.innerText = "📖";

            }


            card.appendChild(cover);


            const title =
                document.createElement("div");

            title.className = "book-title";

            title.innerText =
                item.name;


            card.appendChild(title);


            const author =
                document.createElement("div");

            author.className = "book-author";

            author.innerText =
                item.description;


            card.appendChild(author);


            addDelete(card,index);

            grid.appendChild(card);

        });


        container.appendChild(grid);

    }


    else{

        const grid =
            document.createElement("div");

        grid.className = "card-grid";


        items.forEach(function(item,index){

            const card =
                document.createElement("div");

            card.className = "generic-card";


            card.innerHTML = `

                <div class="generic-icon">
                    ${item.icon || "♡"}
                </div>

                <div class="generic-title">
                    ${item.name}
                </div>

                <div class="generic-description">
                    ${item.description || ""}
                </div>

            `;


            addDelete(card,index);

            grid.appendChild(card);

        });


        container.appendChild(grid);

    }

}


/* DELETE ITEM */

function addDelete(card,index){

    const button =
        document.createElement("button");

    button.innerText = "×";


    button.style.position = "absolute";

    button.style.top = "8px";

    button.style.right = "8px";

    button.style.border = "0";

    button.style.borderRadius = "50%";

    button.style.width = "30px";

    button.style.height = "30px";

    button.style.background = "white";

    button.style.cursor = "pointer";


    button.onclick = function(event){

        event.stopPropagation();


        if(confirm("Delete this item?")){

            database[currentCollection]
                .sections[currentSection]
                .splice(index,1);


            saveData();

            renderItems();

        }

    };


    card.appendChild(button);

}


/* CLOSE IMAGE */

function closeViewer(){

    document.getElementById("imageViewer")
        .style.display = "none";

}
   
           </script>
           <div class="bookshelf" onclick="openCollection('books')">
              <div class="laptop" onclick="openCollection('laptop')">
                 <div class="headphones" onclick="openCollection('music')">
                    <div class="bed" onclick="openCollection('bed')">
                       <div class="photo-frame" onclick="openCollection('photos')">
